name: Photo proof policies

on:
  pull_request:
  push:
    branches: ['feature/quest-photo-proofs']

jobs:
  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
